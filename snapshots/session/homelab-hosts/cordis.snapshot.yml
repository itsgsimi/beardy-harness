- id: subprocess
  disabled: true
- insert:
    - id: homelab-subprocess-fixture
      name: './fixture.mjs'
    - id: tool-homelab
      name: '@deepseek-ai/dsh-tool-homelab'
      config:
        bdyPath: !!js process.getBuiltinModule('node:path').join(process.cwd(), 'beardy', 'bin', 'bdy')
        secretsPath: !!js process.getBuiltinModule('node:path').join(process.cwd(), 'beardy', 'secrets.env')
        allowedHosts: [mini]
        allowedAgentPresets: any
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
