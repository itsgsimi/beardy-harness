- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
- id: web
  config:
    fetchProvider: weather-fixture
- id: tool-web
  disabled: true
- id: web-fetch-http
  disabled: true
- insert:
    - id: weather-fixture
      name: './fixture.mjs'
    - id: tool-weather
      name: '@deepseek-ai/dsh-tool-weather'
      config:
        defaultLocation: Phoenix, AZ
        units: us
        days: 3
