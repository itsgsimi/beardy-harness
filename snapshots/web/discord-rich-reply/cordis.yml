# The shipped Web host owns the real Discord gateway and Beardy agent composition.
- id: llm-deepseek
  disabled: true
- id: llm-pi-ai
  disabled: true
# Keyless replay has no provider HTTP request to receive package inventory.
- id: plugin-package-inventory-deepseek
  disabled: true
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
- id: session-title-llm
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: false
- insert:
    - id: discord-snapshot-transport
      name: ./discord-transport.ts
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 128000
    - id: discord-gateway
      name: '@deepseek-ai/dsh-discord-gateway'
      inject: [discordSnapshotTransport]
      config:
        tokenEnv: DSH_DISCORD_SNAPSHOT_TOKEN
        allowedUserIds: ['138391763999129600']
        allowedChannelIds: []
        workspacePath: !!js process.cwd()
        agentPreset: beardy-discord
        permissionPreset: workspace-write
        inboundDebounceMs: 0
        typingIndicator: false
        reactionStatus: false
