<!doctype html><html><head><style>body{margin:0;padding:28px;background:#f8fafc;color:#182230;font:16px system-ui}h1{font-size:24px}button{padding:12px 20px;border:0;border-radius:8px;background:#047857;color:white;font:inherit}.bar{height:48px;background:#34d399;border-radius:8px;transition:width .2s}small{display:block;margin:20px 0;color:#475467}</style></head><body><h1>Interactive chart mockup</h1><p>Illustrative latency: <strong id="value">400 ms</strong></p><div class="bar" id="bar" style="width:50%"></div><small>Toggle the dataset to compare the proposed behavior.</small><button id="toggle" onclick="const faster=this.dataset.fast!=='yes';this.dataset.fast=faster?'yes':'no';document.getElementById('value').textContent=faster?'200 ms':'400 ms';document.getElementById('bar').style.width=faster?'25%':'50%'">Toggle data</button><p id="isolation"></p><script>try{parent.document.body;document.getElementById('isolation').textContent='Parent accessible'}catch{document.getElementById('isolation').textContent='Parent isolated'}fetch('https://visual-fixture.invalid/probe').catch(()=>{document.body.dataset.network='blocked'})</script></body></html>
