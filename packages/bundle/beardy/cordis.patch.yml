# The Beardy bundle patch: a persistent, history-aware agent profile over
# dsh-base and dsh-web-app. Later profile and home patches may replace these
# rows in the normal profile-layer order.

# The scoped Beardy preset owns identity and personality. A host-level persona
# would be shadowed by the standard preset's scoped persona.
- id: agent-preset-registry
  config:
    default: beardy

# Beardy keeps a durable derived search index for cross-session recall. The
# index is separate from session persistence and opens on the first search.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-search.sqlite')
    openAt: first-search

- insert:
    - id: tool-session-query
      name: '@deepseek-ai/dsh-tool-session-query'
      config:
        maxSearchResults: 100
        searchTimeoutMs: 30000

    # A clock for conversations that span days: "this morning" and elapsed-time
    # readings resolve against the browser's zone when a turn carries one, and
    # the process zone otherwise. Durable injections are throttled to hourly and
    # name the local weekday so digests do not guess it from the date.
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
      config:
        refreshIntervalMs: 3600000
        weekday: true

    # Three days is the complete wttr.in j1 forecast.
    - id: tool-weather
      name: '@deepseek-ai/dsh-tool-weather'
      config:
        defaultLocation: Phoenix, AZ
        units: us
        days: 3

    # Read-only Beardy observations. A personal patch supplies the checkout,
    # secrets file, Docker host IDs, and allowed agent presets before enabling it.
    - id: tool-homelab
      name: '@deepseek-ai/dsh-tool-homelab'
      disabled: true

# Beardy uses the local SearXNG JSON API for search, so no DeepSeek search
# credential is needed. Set SEARXNG_BASE_URL to use another instance; the
# The SearXNG provider resolves its endpoint through the launch-environment snapshot.
- id: web
  config:
    searchProvider: searxng
    fetchProvider: http

- id: web-search-deepseek
  disabled: true

- insert:
    - id: web-search-searxng
      name: '@deepseek-ai/dsh-web-search-searxng'

# The base profile keeps fetching off; Beardy's research profile enables it.
- id: tool-web
  disabled: false
  config:
    fetch: true
    searchTimeoutMs: 60000

# Supply the server, credential reference, and worker in the personal profile patch.
- insert:
    - id: tool-odysseus-research
      name: '@deepseek-ai/dsh-tool-odysseus-research'
      disabled: true

# Native research uses the dsh-research definition through its provider and tool.
# Enable both native rows and disable the bridge in one personal profile patch.
- insert:
    - id: research-local
      name: '@deepseek-ai/dsh-research-local'
      disabled: true
      config:
        provider: deepseek-official
        model: deepseek-flash
        ownerScope: profile
        ownerNamespace: beardy

    - id: tool-research
      name: '@deepseek-ai/dsh-tool-research'
      disabled: true

# The `dsh.client` research row renders saved reports for both research tools
# and adds the research worker picker to Settings → Plugins.
- insert:
    - id: ui-research
      name: '@deepseek-ai/dsh-client-ui-research'

# The `dsh.client` visuals row renders present_visual snapshots inline at
# their recorded position in the Web conversation.
- insert:
    - id: ui-visuals
      name: '@deepseek-ai/dsh-client-ui-visuals'

# The personal profile supplies the private token path, caller teams, and season.
# Enable both rows together once the private import source or store is available.
- insert:
    - id: fantasy-yahoo
      name: '@deepseek-ai/dsh-fantasy-yahoo'
      disabled: true

    - id: tool-fantasy
      name: '@deepseek-ai/dsh-tool-fantasy'
      disabled: true

# Weekly reports need the Yahoo provider, the Sleeper projection provider, native research with
# profile ownership, and the Discord gateway. The personal profile supplies teams, channels,
# schedules, and the workspace; enable the projection row with the report row, since its defaults
# need no private values. The row id differs from the Odysseus bridge row `fantasy-reports`, so both
# can load during a shadow week.
- insert:
    - id: fantasy-projections-sleeper
      name: '@deepseek-ai/dsh-fantasy-projections-sleeper'
      disabled: true

    - id: fantasy-weekly-reports
      name: '@deepseek-ai/dsh-fantasy-reports'
      disabled: true

# Ring camera events: the provider watches the configured doorbell and cameras, and the watch
# classifies each event's frames, notifies through the Discord gateway outbox, and keeps a history
# the `camera` tool reads. The personal profile supplies the token reference, devices, ffmpeg path,
# time zone, policy, and channel; enable both rows together after the one-time Ring login.
- insert:
    - id: camera-ring
      name: '@deepseek-ai/dsh-camera-ring'
      disabled: true

    - id: camera-watch
      name: '@deepseek-ai/dsh-camera-watch'
      disabled: true

# Signal notices: the provider talks to a loopback signal-cli daemon started with `-a <number>`, so
# the number stays out of the profile, and the notice consumer claims camera, health, and scheduled
# notices whose target is `signal:group:<base64 id>` or `signal:number:<E.164>`. The personal
# profile supplies the daemon's baseUrl and points producers at a Signal target; enable both rows
# together.
- insert:
    - id: signal-cli
      name: '@deepseek-ai/dsh-signal-cli'
      disabled: true

    - id: signal-notices
      name: '@deepseek-ai/dsh-signal-notices'
      disabled: true

# Discord: outbound delivery, an inbound listener, and the unattended cron fires. All three mount
# only when a bot token is present, so a checkout without Discord credentials starts unchanged. The
# token itself lives in the environment or the root .env; the composition names the reference, never
# the secret. Destination and authority data (tool-discord `channelId`/`dmUserIds`, gateway
# `allowedUserIds`/`workspacePath`/`permissionPreset`, cron's `jobs`) are deployment values and are
# NOT set here: a profile-layer `- id:` row replaces a row's config wholesale, so supply them from
# your own `~/.dsh/profiles/<profile>/cordis.patch.yml`. An enabled row without them fails the
# schema's required-field check naming the missing field instead of running on someone else's values.
- insert:
    - id: tool-discord
      name: '@deepseek-ai/dsh-tool-discord'
      disabled: !!js process.env.DISCORD_BOT_TOKEN === undefined
      config:
        tokenEnv: DISCORD_BOT_TOKEN

    - id: discord-gateway
      name: '@deepseek-ai/dsh-discord-gateway'
      disabled: !!js process.env.DISCORD_BOT_TOKEN === undefined

    # The scheduler mounts with no jobs; define your own briefs in your profile patch.
    - id: cron
      name: '@deepseek-ai/dsh-cron'
      disabled: !!js process.env.DISCORD_BOT_TOKEN === undefined
      config:
        jobs: []

    # Personal backends, routes, groups, and operator presets are deployment data.
    - id: local-model-control
      name: '@deepseek-ai/dsh-local-model-control'
      disabled: true

    # Endpoint targets and notice channel are supplied only by the deployment patch.
    - id: health
      name: '@deepseek-ai/dsh-health'
      config:
        probes: []

# Keep the Host Schedule available to Discord sessions while cron retains its own unattended runs.
- id: schedule
  disabled: false

# Brief collection runs only inside the Agent preset a cron job names, where a
# personal preset row supplies its job, sources, and limits. Keep this Host row
# disabled: the plugin restricts tools, which requires an Agent scope.
- insert:
    - id: brief-collector
      name: '@deepseek-ai/dsh-brief-collector'
      disabled: true

# Voice input: the Whisper transcription host row stays disabled until a
# profile layer enables it by id with its endpoint, and the `dsh.client`
# dictation row joins the browser roster that dsh-web-app's modules row scans.
- insert:
    - id: speech-whisper
      name: '@deepseek-ai/dsh-speech-whisper'
      disabled: true
      config:
        endpoint: http://127.0.0.1:8178/inference
        ffmpegPath: ffmpeg
        maxAudioBytes: 16777216
        maxDurationSeconds: 180
        timeoutMs: 120000
        maxConcurrent: 2

    - id: ui-voice
      name: '@deepseek-ai/dsh-client-ui-voice'
