# The Beardy bundle patch: a persistent, history-aware agent profile over
# dsh-base and dsh-web-app. Later profile and home patches may replace these
# rows in the normal profile-layer order.

# The scoped Beardy preset owns identity and personality. A host-level persona
# would be shadowed by the standard preset's scoped persona.
- id: agent-presets
  config:
    default: beardy

# Beardy keeps a durable derived search index for cross-session recall. The
# index is separate from session persistence and opens on the first search.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-search.sqlite')
    openAt: first-search

- insert:
    - id: tool-session-query
      name: '@deepseek-ai/dsh-tool-session-query'
      config:
        maxSearchResults: 100
        searchTimeoutMs: 30000

# Beardy uses the local SearXNG JSON API for search, so no DeepSeek search
# credential is needed. Set SEARXNG_BASE_URL to use another instance; the
# default matches the local container documented by the SearXNG provider.
- id: web
  config:
    searchProvider: searxng
    fetchProvider: http

- id: web-search-deepseek
  disabled: true

- insert:
    - id: web-search-searxng
      name: '@deepseek-ai/dsh-web-search-searxng'
      config:
        baseURL: !!js process.env.SEARXNG_BASE_URL ?? 'http://127.0.0.1:8080'

# The base profile keeps fetching off; Beardy's research profile enables it.
- id: tool-web
  disabled: false
  config:
    fetch: true
    searchTimeoutMs: 60000

# Discord: outbound delivery, an inbound listener, and the unattended morning
# brief. All three mount only when a bot token is present, so a checkout without
# Discord credentials starts unchanged. The token itself lives in the environment
# or the root .env; the composition names the reference, never the secret.
- insert:
    - id: tool-discord
      name: '@deepseek-ai/dsh-tool-discord'
      disabled: !!js process.env.DISCORD_BOT_TOKEN === undefined
      config:
        tokenEnv: DISCORD_BOT_TOKEN
        channelId: !!js process.env.DISCORD_CHANNEL_ID ?? process.env.DISCORD_DM_CHANNEL_ID ?? '0'
        dmUserIds: !!js (process.env.DISCORD_DM_USER_IDS || '').split(' ').filter(Boolean)

    - id: discord-gateway
      name: '@deepseek-ai/dsh-discord-gateway'
      disabled: !!js process.env.DISCORD_BOT_TOKEN === undefined
      config:
        tokenEnv: DISCORD_BOT_TOKEN
        allowedUserIds: !!js (process.env.DISCORD_ALLOWED_USER_IDS || '').split(' ').filter(Boolean)
        workspacePath: !!js process.cwd()
        agentPreset: beardy
        permissionPreset: danger-full-access

    # The brief runs unattended at 07:00 local time and delivers itself with the
    # discord_send tool the Beardy preset has. Edit the feed list or schedule here.
    - id: cron
      name: '@deepseek-ai/dsh-cron'
      disabled: !!js process.env.DISCORD_BOT_TOKEN === undefined
      config:
        jobs:
          - name: morning-brief
            expression: '0 7 * * *'
            timezone: !!js Intl.DateTimeFormat().resolvedOptions().timeZone
            agentPreset: beardy
            permissionPreset: danger-full-access
            workspacePath: !!js process.cwd()
            prompt: >-
              Prepare the morning brief for Goran and send it with discord_send.
              Fetch these feeds with web_fetch and pick the three to five items that
              matter most in each category: AI and technology
              (https://hnrss.org/frontpage, https://www.theverge.com/rss/index.xml),
              world news (https://feeds.bbci.co.uk/news/world/rss.xml),
              science (https://www.nature.com/nature.rss). Then get the weather for
              today and the next five days with web_fetch from
              https://wttr.in/?format=j1. Write one Discord message under 2000
              characters: a short headline list per category, then the forecast.
              Plain text with line breaks, no tables.
