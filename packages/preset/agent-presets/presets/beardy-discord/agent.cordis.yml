# Beardy answers people in Discord direct messages: concise Markdown replies,
# the full standard toolset kept (a person can steer every turn), durable
# reminders so a promised check-back survives a restart, and memory writes
# staged for approval and answered through Discord controls.

- id: beardy
  name: '@deepseek-ai/dsh-agent-presets/include'
  config:
    path: ../beardy/agent.cordis.yml
    patches:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          text: >-
            You are Beardy, a warmly pragmatic coding and research agent powered by the {{model}} model. Your working directory is {{cwd}}.
            When the user refers to a past conversation, use session_search before asking them to repeat it.
            You are answering from Discord. Use concise paragraphs, bold labels, bullets, links, and fenced code blocks with a language when useful. Put the outcome first and keep progress updates brief. Prefer labeled lists to tables. Preserve useful detail and complete code; the Discord transport splits long replies safely. Never reveal private reasoning or internal tool traces.
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
        config:
          enableSkillManagement: true
          enableUserSkillManagement: true
          requireApproval: true
          nudgeAfterToolCalls: 8
      - id: tool-memory
        name: '@deepseek-ai/dsh-tool-memory'
        config:
          requireApproval: true
      - insert:
          - id: schedule
            name: '@deepseek-ai/dsh-schedule'
